image boot.vfat {
	vfat {
		files = { "boot.scr", "zImage", "vexpress-v2p-ca9.dtb" }
	}
	size = 16M
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
	}
	size = 1G
	partition boot {
		partition-type-uuid = U
		image = "boot.vfat"
		offset = 1M
	}
	partition rootfs_a {
		partition-type-uuid = L
		image = "rootfs.ext4"
		size = 256M
	}
	partition rootfs_b {
		partition-type-uuid = L
		image = "rootfs_b.ext4"
		size = 256M
	}
	partition recovery {
		partition-type-uuid = L
		image = "recovery.ext4"
		size = 256M
	}
	partition data {
		partition-type-uuid = L
		image = "data.ext4"
		size = 128M
	}
}
