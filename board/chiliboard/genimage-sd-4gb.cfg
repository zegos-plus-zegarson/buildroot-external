# 4 GB microSD card image for chiliBoard. Rootfs A is the current boot target.

image boot.vfat {
	vfat {
		files = {
			"MLO",
			"u-boot.img",
			"am335x-chiliboard.dtb",
			"zImage",
			"boot.scr"
		}
	}

	size = 16M
}

image sdcard.img {
	hdimage {
	}

	partition u-boot {
		# Retain the type from the previously working SD image until
		# cold boot confirms the new 4 GB layout on hardware.
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		offset = 1M
	}

	partition rootfs_a {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 1430M
	}

	partition rootfs_b {
		partition-type = 0x83
		image = "rootfs_b.ext4"
		size = 1430M
	}

	partition userdata {
		partition-type = 0x83
		image = "userdata.ext4"
		size = 925M
	}
}
