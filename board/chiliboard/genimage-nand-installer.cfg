image nand-installer-boot.vfat {
	vfat {
		files = {
			"MLO",
			"u-boot.img",
			"flash-nand.scr"
		}
	}
	size = 16M
}

image nand-installer-payload.vfat {
	vfat {
		extraargs = "-F 32"
		file nand/am335x-chiliboard.dtb {
			image = "am335x-chiliboard.dtb"
		}
		file nand/zImage {
			image = "zImage"
		}
		file nand/rootfs.ubi {
			image = "rootfs.ubi"
		}
	}
	size = 272M
}

image nand-installer.img {
	hdimage {
	}
	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "nand-installer-boot.vfat"
		offset = 1M
	}
	partition payload {
		partition-type = 0xC
		image = "nand-installer-payload.vfat"
	}
}
